<svg xmlns="http://w3.org" viewBox="0 0 320 40" width="100%" height="100%">
  <defs>
    <style>
      .wordmark-main {
        font-family: 'Product Sans', 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: -0.5px;
      }
      .wordmark-com {
        font-family: 'Product Sans', 'Inter', system-ui, sans-serif;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0px;
      }
    </style>
  </defs>

  <text x="10" y="28" class="wordmark-main">
    <!-- LoyKandahar in a solid, premium deep historic blue -->
    <tspan fill="#1A1A1A">LoyKandahar</tspan>
    <!-- .com in a clean, fully visible dark charcoal -->
    <tspan fill="#1A1A1A" class="wordmark-com">.com</tspan>
  </text>
</svg>
